<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gerenciamento de Prioridades</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .auth-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .password-field {
            position: relative;
        }

        .password-field input {
            padding-right: 44px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
            color: #667eea;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: #5568d3;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #5568d3;
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .toggle-form {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .toggle-form a {
            color: #667eea;
            cursor: pointer;
            font-weight: bold;
        }

        .toggle-form a:hover {
            text-decoration: underline;
        }

        .forgot-link {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .forgot-link a {
            color: #667eea;
            cursor: pointer;
            font-weight: 500;
        }

        .forgot-link a:hover {
            text-decoration: underline;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Dark Mode - Auth */
        .btn-darkmode-auth {
            position: fixed;
            top: 16px;
            right: 16px;
            background: #444;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            z-index: 9999;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .btn-darkmode-auth:hover {
            background: #222;
            transform: translateY(-2px);
        }
        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        body.dark-mode .auth-container {
            background: #1e1e2e;
            color: #e0e0e0;
        }
        body.dark-mode .auth-header h1 {
            color: #a89be8;
        }
        body.dark-mode .auth-header p {
            color: #aaa;
        }
        body.dark-mode label {
            color: #ccc;
        }
        body.dark-mode input {
            background: #2a2a3e;
            border-color: #444;
            color: #e0e0e0;
        }
        body.dark-mode .toggle-password {
            color: #a89be8;
        }
        body.dark-mode input::placeholder {
            color: #888;
        }
        body.dark-mode input:focus {
            border-color: #a89be8;
        }
        body.dark-mode .toggle-form {
            color: #aaa;
        }
        body.dark-mode .toggle-form a {
            color: #a89be8;
        }
        body.dark-mode .btn-darkmode-auth {
            background: #667eea;
        }
        body.dark-mode .btn-darkmode-auth:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <button class="btn-darkmode-auth" id="btnDarkModeAuth" onclick="toggleDarkMode()" title="Alternar modo escuro">🌙 Dark</button>
    <div class="auth-container">
        <div class="auth-header">
            <h1>📊 Sistema de Prioridades</h1>
            <p>Gerenciamento Inteligente de Tarefas</p>
        </div>

        <div id="messageContainer"></div>

        <!-- Abas de Login -->
        <div style="display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0;">
            <button onclick="switchTab('email')" id="emailTab" style="flex: 1; padding: 12px; background: #667eea; color: white; border: none; border-radius: 8px 8px 0 0; cursor: pointer; font-weight: bold;">📧 Email</button>
            <button onclick="switchTab('code')" id="codeTab" style="flex: 1; padding: 12px; background: #e0e0e0; color: #666; border: none; border-radius: 8px 8px 0 0; cursor: pointer; font-weight: bold;">🔑 Código</button>
        </div>

        <!-- Form de Login por Email -->
        <div id="emailForm" class="form-section active">
            <div class="form-group">
                <label for="loginEmail">Email:</label>
                <input type="email" id="loginEmail" placeholder="seu@email.com.br" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Senha:</label>
                <div class="password-field">
                    <input type="password" id="loginPassword" placeholder="Sua senha" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)" aria-label="Mostrar senha">👁️</button>
                </div>
            </div>
            <div class="forgot-link">
                <a onclick="switchToForgotPassword()">Esqueci minha senha</a>
            </div>
            <button class="btn-submit" onclick="handleLogin()" id="loginBtn">Entrar</button>
            <div class="toggle-form">
                Não tem conta? <a onclick="switchToRegister()">Cadastre-se aqui Gratuitamente</a>
            </div>
        </div>

        <!-- Form de Login por Código -->
        <div id="codeForm" class="form-section">
            <div class="form-group">
                <label for="projectCode">Código do Projeto:</label>
                <input type="text" id="projectCode" placeholder="Ex: CXT12345 ou 12345CXT" required maxlength="8">
            </div>
            <button class="btn-submit" onclick="handleCodeLogin()" id="codeBtn">Acessar Projeto</button>
            <div class="toggle-form">
                Novo por aqui? <a onclick="switchToRegister()">Crie uma conta</a>
            </div>
        </div>

        <!-- Form de Esqueci Senha -->
        <div id="forgotForm" class="form-section">
            <div class="form-group">
                <label for="forgotEmail">Email cadastrado:</label>
                <input type="email" id="forgotEmail" placeholder="seu@email.com" required>
            </div>
            <button class="btn-submit" onclick="handleForgotPassword()" id="forgotBtn">Enviar link de recuperação</button>
            <div class="toggle-form">
                Lembrou a senha? <a onclick="switchTab('email')">Voltar ao login</a>
            </div>
        </div>

        <!-- Form de Nova Senha (recuperação) -->
        <div id="resetForm" class="form-section">
            <div style="text-align:center; margin-bottom: 16px; color: #555; font-size: 14px;">
                🔐 Digite sua nova senha abaixo
            </div>
            <div class="form-group">
                <label for="newPassword">Nova Senha:</label>
                <div class="password-field">
                    <input type="password" id="newPassword" placeholder="Mínimo 6 caracteres" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('newPassword', this)" aria-label="Mostrar senha">👁️</button>
                </div>
            </div>
            <div class="form-group">
                <label for="newPasswordConfirm">Confirmar Nova Senha:</label>
                <div class="password-field">
                    <input type="password" id="newPasswordConfirm" placeholder="Confirme a nova senha" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('newPasswordConfirm', this)" aria-label="Mostrar senha">👁️</button>
                </div>
            </div>
            <button class="btn-submit" onclick="handleResetPassword()" id="resetBtn">Salvar Nova Senha</button>
        </div>

        <!-- Form de Cadastro -->
        <div id="registerForm" class="form-section">
            <div class="form-group">
                <label for="registerEmail">Email:</label>
                <input type="email" id="registerEmail" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label for="registerPassword">Senha:</label>
                <div class="password-field">
                    <input type="password" id="registerPassword" placeholder="Mínimo 6 caracteres" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('registerPassword', this)" aria-label="Mostrar senha">👁️</button>
                </div>
            </div>
            <div class="form-group">
                <label for="registerPasswordConfirm">Confirmar Senha:</label>
                <div class="password-field">
                    <input type="password" id="registerPasswordConfirm" placeholder="Confirme sua senha" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('registerPasswordConfirm', this)" aria-label="Mostrar senha">👁️</button>
                </div>
            </div>
            <button class="btn-submit" onclick="handleRegister()" id="registerBtn">Cadastrar</button>
            <div class="toggle-form">
                Já tem conta? <a onclick="switchTab('email')">Entre aqui</a>
            </div>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        // Verificar se usuário está em modo de recuperação de senha
        window.addEventListener('load', async function() {
            await window.initSupabase();
            const client = window.getClient();

            // Detectar link de recuperação de senha via hash da URL
            const hash = window.location.hash;
            if (hash && hash.includes('type=recovery')) {
                switchToResetPassword();
                return;
            }
            
            if (client && client.auth) {
                // Ouvir evento PASSWORD_RECOVERY do Supabase
                client.auth.onAuthStateChange((event, session) => {
                    if (event === 'PASSWORD_RECOVERY') {
                        switchToResetPassword();
                    }
                });
            }
        });

        let currentTab = 'email';

        function switchTab(tab) {
            currentTab = tab;
            const emailForm = document.getElementById('emailForm');
            const codeForm = document.getElementById('codeForm');
            const registerForm = document.getElementById('registerForm');
            const forgotForm = document.getElementById('forgotForm');
            const resetForm = document.getElementById('resetForm');
            const emailTab = document.getElementById('emailTab');
            const codeTab = document.getElementById('codeTab');

            emailForm.classList.remove('active');
            codeForm.classList.remove('active');
            registerForm.classList.remove('active');
            forgotForm.classList.remove('active');
            resetForm.classList.remove('active');
            emailTab.style.background = '#e0e0e0';
            emailTab.style.color = '#666';
            codeTab.style.background = '#e0e0e0';
            codeTab.style.color = '#666';

            if (tab === 'email') {
                emailForm.classList.add('active');
                emailTab.style.background = '#667eea';
                emailTab.style.color = 'white';
            } else {
                codeForm.classList.add('active');
                codeTab.style.background = '#667eea';
                codeTab.style.color = 'white';
            }

            clearMessages();
        }

        function switchToResetPassword() {
            document.getElementById('emailForm').classList.remove('active');
            document.getElementById('codeForm').classList.remove('active');
            document.getElementById('forgotForm').classList.remove('active');
            document.getElementById('registerForm').classList.remove('active');
            document.getElementById('resetForm').classList.add('active');
            document.getElementById('emailTab').style.background = '#e0e0e0';
            document.getElementById('emailTab').style.color = '#666';
            document.getElementById('codeTab').style.background = '#e0e0e0';
            document.getElementById('codeTab').style.color = '#666';
            clearMessages();
        }

        function switchToRegister() {
            document.getElementById('emailForm').classList.remove('active');
            document.getElementById('codeForm').classList.remove('active');
            document.getElementById('forgotForm').classList.remove('active');
            document.getElementById('resetForm').classList.remove('active');
            document.getElementById('registerForm').classList.add('active');
            document.getElementById('emailTab').style.background = '#e0e0e0';
            document.getElementById('emailTab').style.color = '#666';
            document.getElementById('codeTab').style.background = '#e0e0e0';
            document.getElementById('codeTab').style.color = '#666';
            clearMessages();
        }

        function switchToForgotPassword() {
            document.getElementById('emailForm').classList.remove('active');
            document.getElementById('codeForm').classList.remove('active');
            document.getElementById('registerForm').classList.remove('active');
            document.getElementById('resetForm').classList.remove('active');
            document.getElementById('forgotForm').classList.add('active');
            document.getElementById('emailTab').style.background = '#e0e0e0';
            document.getElementById('emailTab').style.color = '#666';
            document.getElementById('codeTab').style.background = '#e0e0e0';
            document.getElementById('codeTab').style.color = '#666';
            clearMessages();
        }

        function showMessage(message, type) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="message ${type}">${message}</div>`;
        }

        function clearMessages() {
            document.getElementById('messageContainer').innerHTML = '';
        }

        function togglePassword(inputId, buttonEl) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            if (buttonEl) {
                buttonEl.textContent = isHidden ? '🙈' : '👁️';
                buttonEl.setAttribute('aria-label', isHidden ? 'Ocultar senha' : 'Mostrar senha');
            }
        }

        function translateAuthError(message) {
            if (!message) {
                return 'Erro de autenticação. Tente novamente.';
            }

            const text = message.toLowerCase();

            if (text.includes('invalid login credentials')) {
                return 'Credenciais inválidas. Verifique seu email e senha.';
            }

            if (text.includes('email not confirmed')) {
                return 'Seu email ainda não foi confirmado. Verifique sua caixa de entrada.';
            }

            if (text.includes('user already registered') || text.includes('user already exists') || text.includes('already registered')) {
                return 'Já existe uma conta registrada com este email.';
            }

            if (text.includes('password should be at least') || text.includes('password length')) {
                return 'A senha deve ter no mínimo 6 caracteres.';
            }

            if (text.includes('invalid email') || text.includes('validate email')) {
                return 'Email inválido. Verifique o endereço digitado.';
            }

            if (text.includes('rate limit')) {
                return 'Muitas tentativas. Aguarde alguns minutos e tente novamente.';
            }

            return message;
        }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            if (!email || !password) {
                showMessage('❌ Preencha todos os campos!', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Entrando...';

            try {
                await window.initSupabase();
                const client = window.getClient();
                if (!client) {
                    showMessage('❌ Sistema não inicializou. Recarregue.', 'error');
                    return;
                }
                
                const { data, error } = await client.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    const userMessage = translateAuthError(error.message || '');
                    showMessage('❌ ' + userMessage, 'error');
                } else {
                    showMessage('✅ Login realizado! Redirecionando...', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                }
            } catch (error) {
                showMessage('❌ Erro: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Entrar';
            }
        }

        async function handleCodeLogin() {
            const code = document.getElementById('projectCode').value.trim().toUpperCase();
            const btn = document.getElementById('codeBtn');

            if (!code) {
                showMessage('❌ Digite o código!', 'error');
                return;
            }

            if (!validarCodigoProject(code)) {
                showMessage('❌ Código inválido! Use o formato: 8 caracteres contendo CXT ou CEC (ex: CXT12345 ou CEC12345)', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Acessando...';

            try {
                await window.initSupabase();
                const client = window.getClient();
                if (!client) {
                    showMessage('❌ Sistema não inicializou. Recarregue.', 'error');
                    return;
                }

                let project = null;

                // 1ª tentativa: RPC pública (ignora RLS)
                const { data: rpcResult, error: rpcError } = await client
                    .rpc('get_project_by_code', { p_code: code });

                if (!rpcError && rpcResult && rpcResult.length > 0) {
                    project = rpcResult[0];
                    console.log('✅ Projeto encontrado via RPC:', project.name);
                } else {
                    console.warn('⚠️ RPC falhou ou não encontrou:', rpcError?.message);

                    // 2ª tentativa: query direta por project_code
                    const { data: byCode } = await client
                        .from('projects')
                        .select('*')
                        .ilike('project_code', code)
                        .limit(1)
                        .single();

                    if (byCode) {
                        project = byCode;
                        console.log('✅ Projeto encontrado por project_code:', project.name);
                    } else {
                        // 3ª tentativa: varrer todos (último recurso, pode ser bloqueado por RLS)
                        const { data: allProjects } = await client.from('projects').select('*');
                        project = allProjects?.find(p =>
                            p.project_code?.toUpperCase() === code
                        ) || null;
                        if (project) console.log('✅ Projeto encontrado via scan:', project.name);
                    }
                }

                if (!project) {
                    showMessage('❌ Código não encontrado! Verifique o código e tente novamente.', 'error');
                } else {
                    // Sempre usar o código que o usuário digitou (garante não salvar null)
                    const storedCode = project.project_code || code;
                    localStorage.setItem('projectCode', storedCode);
                    localStorage.setItem('projectId',   project.id);
                    localStorage.setItem('projectName', project.name);
                    console.log('💾 Salvo no localStorage — code:', storedCode, '| id:', project.id);
                    const targetPage = storedCode.toUpperCase().includes('CEC') ? '5w2h.html' : 'index.html';
                    showMessage('✅ Acesso concedido! Carregando...', 'success');
                    setTimeout(() => {
                        window.location.href = targetPage + '?t=' + Date.now();
                    }, 800);
                }
            } catch (error) {
                console.error('❌ Erro no handleCodeLogin:', error);
                showMessage('❌ Erro: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Acessar Projeto';
            }
        }

        function validarCodigoProject(code) {
            const cleaned = code.trim();
            
            // Verifica se tem 8 caracteres exatamente
            if (cleaned.length !== 8) {
                return false;
            }
            
            // Verifica se contém CXT ou CEC em qualquer posição (case-insensitive)
            const upper = cleaned.toUpperCase();
            if (!upper.includes('CXT') && !upper.includes('CEC')) {
                return false;
            }
            
            return true;
        }

        async function handleResetPassword() {
            const newPassword = document.getElementById('newPassword').value;
            const newPasswordConfirm = document.getElementById('newPasswordConfirm').value;
            const btn = document.getElementById('resetBtn');

            if (!newPassword || !newPasswordConfirm) {
                showMessage('❌ Preencha todos os campos!', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showMessage('❌ A senha deve ter no mínimo 6 caracteres!', 'error');
                return;
            }

            if (newPassword !== newPasswordConfirm) {
                showMessage('❌ As senhas não conferem!', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Salvando...';

            try {
                await window.initSupabase();
                const client = window.getClient();
                if (!client) {
                    showMessage('❌ Sistema não inicializou. Recarregue.', 'error');
                    return;
                }

                const { error } = await client.auth.updateUser({ password: newPassword });

                if (error) {
                    showMessage('❌ ' + translateAuthError(error.message || ''), 'error');
                } else {
                    showMessage('✅ Senha alterada com sucesso! Redirecionando...', 'success');
                    // Limpar hash da URL
                    history.replaceState(null, '', window.location.pathname);
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                }
            } catch (error) {
                showMessage('❌ Erro: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Salvar Nova Senha';
            }
        }

        async function handleForgotPassword() {
            const email = document.getElementById('forgotEmail').value.trim();
            const btn = document.getElementById('forgotBtn');

            if (!email) {
                showMessage('❌ Digite seu email!', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Enviando...';

            try {
                await window.initSupabase();
                const client = window.getClient();
                if (!client) {
                    showMessage('❌ Sistema não inicializou. Recarregue.', 'error');
                    return;
                }

                const { error } = await client.auth.resetPasswordForEmail(email, {
                    redirectTo: 'https://caxito.com.br/auth.html'
                });

                if (error) {
                    showMessage('❌ ' + translateAuthError(error.message || ''), 'error');
                } else {
                    showMessage('✅ Link de recuperação enviado! Verifique sua caixa de entrada. se o e-mail for válido', 'success');
                    document.getElementById('forgotEmail').value = '';
                }
            } catch (error) {
                showMessage('❌ Erro: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Enviar link de recuperação';
            }
        }

        async function handleRegister() {
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const passwordConfirm = document.getElementById('registerPasswordConfirm').value;
            const btn = document.getElementById('registerBtn');

            if (!email || !password || !passwordConfirm) {
                showMessage('❌ Preencha todos os campos!', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('❌ A senha deve ter no mínimo 6 caracteres!', 'error');
                return;
            }

            if (password !== passwordConfirm) {
                showMessage('❌ As senhas não conferem!', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Cadastrando...';

            try {
                await window.initSupabase();
                const client = window.getClient();
                if (!client) {
                    showMessage('❌ Sistema não inicializou. Recarregue.', 'error');
                    return;
                }
                
                const { data, error } = await client.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        emailRedirectTo: `https://caxito.com.br/auth.html`
                    }
                });

                if (error) {
                    const userMessage = translateAuthError(error.message || '');
                    showMessage('❌ ' + userMessage, 'error');
                } else {
                    showMessage('✅ Cadastro realizado! Verifique seu email.', 'success');
                    setTimeout(() => {
                        switchTab('email');
                        document.getElementById('registerEmail').value = '';
                        document.getElementById('registerPassword').value = '';
                        document.getElementById('registerPasswordConfirm').value = '';
                    }, 2000);
                }
            } catch (error) {
                showMessage('❌ Erro ao cadastrar: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Cadastrar';
            }
        }

        // Dark Mode
        function toggleDarkMode() {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', isDark ? '1' : '0');
            document.getElementById('btnDarkModeAuth').textContent = isDark ? '☀️ Claro' : '🌙 Dark';
        }
        (function() {
            if (localStorage.getItem('darkMode') === '1') {
                document.body.classList.add('dark-mode');
                const btn = document.getElementById('btnDarkModeAuth');
                if (btn) btn.textContent = '☀️ Claro';
            }
        })();

        // Permitir Enter nas inputs
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                const emailForm = document.getElementById('emailForm');
                const codeForm = document.getElementById('codeForm');
                const registerForm = document.getElementById('registerForm');
                
                if (emailForm.classList.contains('active')) {
                    handleLogin();
                } else if (codeForm.classList.contains('active')) {
                    handleCodeLogin();
                } else if (registerForm.classList.contains('active')) {
                    handleRegister();
                }
            }
        });
    </script>
</body>
</html>
