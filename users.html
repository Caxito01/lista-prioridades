<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Usuários - Sistema de Gerenciamento de Prioridades</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
	<link rel="stylesheet" href="styles.css">

	<!-- Supabase e inicialização (mesmo padrão do auth.html) -->
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="supabase-config.js"></script>
	<script src="auth.js?v=1735000002"></script>

	<style>
		body {
			background: #f5f7fb;
		}

		.users-container {
			max-width: 1000px;
			margin: 40px auto;
			background: #ffffff;
			border-radius: 10px;
			box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
			padding: 24px 28px;
		}

		.users-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 20px;
		}

		.users-header h1 {
			font-size: 22px;
			color: #333;
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.users-header h1 span {
			font-size: 24px;
		}

		.users-actions {
			display: flex;
			gap: 10px;
		}

		.btn-small {
			padding: 8px 14px;
			border-radius: 6px;
			border: none;
			cursor: pointer;
			font-size: 13px;
			font-weight: 500;
		}

		.btn-primary {
			background: #667eea;
			color: #fff;
		}

		.btn-secondary {
			background: #e0e0e0;
			color: #333;
		}

		.btn-danger {
			background: #e53935;
			color: #fff;
		}

		.btn-small:disabled {
			opacity: 0.7;
			cursor: not-allowed;
		}

		.message {
			padding: 10px 12px;
			border-radius: 6px;
			margin-bottom: 15px;
			font-size: 13px;
		}

		.message.info {
			background: #e3f2fd;
			color: #0d47a1;
			border: 1px solid #bbdefb;
		}

		.message.error {
			background: #ffebee;
			color: #b71c1c;
			border: 1px solid #ffcdd2;
		}

		.message.success {
			background: #e8f5e9;
			color: #1b5e20;
			border: 1px solid #c8e6c9;
		}

		table.users-table {
			width: 100%;
			border-collapse: collapse;
			margin-top: 10px;
			table-layout: fixed;
		}

		table.users-table th,
		table.users-table td {
			padding: 10px 8px;
			border-bottom: 1px solid #e0e0e0;
			font-size: 13px;
			text-align: left;
		}

		/* Larguras e alinhamento consistentes das colunas */
		table.users-table th:nth-child(1),
		table.users-table td:nth-child(1) {
			width: 50%;
		}

		table.users-table th:nth-child(2),
		table.users-table td:nth-child(2) {
			width: 30%;
			text-align: center;
		}

		table.users-table th:nth-child(3),
		table.users-table td:nth-child(3) {
			width: 20%;
			text-align: center;
		}

		table.users-table th {
			background: #f1f3f7;
			font-weight: 600;
			color: #555;
		}

		table.users-table tbody tr:hover {
			background: #f9fafc;
		}

		.text-center {
			text-align: center;
		}

		.badge {
			display: inline-block;
			padding: 2px 6px;
			border-radius: 4px;
			font-size: 11px;
		}

		.badge-admin {
			background: #fff3e0;
			color: #ef6c00;
			border: 1px solid #ffe0b2;
		}

		.section-tabs {
			display: flex;
			gap: 8px;
			margin-bottom: 20px;
			border-bottom: 2px solid #e0e0e0;
			padding-bottom: 0;
		}
		.tab-btn {
			padding: 10px 22px;
			border: none;
			border-radius: 8px 8px 0 0;
			font-size: 13px;
			font-weight: 600;
			cursor: pointer;
			background: #e0e0e0;
			color: #666;
			transition: all 0.2s;
		}
		.tab-btn.active {
			background: #667eea;
			color: #fff;
		}

		.tab-section { display: none; }
		.tab-section.active { display: block; }

		/* Project Cards */
		.projects-grid {
			display: flex;
			flex-direction: column;
			gap: 10px;
			margin-top: 10px;
		}
		.project-card {
			background: #f9fafc;
			border: 1px solid #e5e7ef;
			border-radius: 8px;
			padding: 14px 18px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 10px;
		}
		.project-card:hover {
			background: #f1f3fb;
		}
		.project-card-info {
			display: flex;
			flex-direction: column;
			gap: 3px;
		}
		.project-card-name {
			font-weight: 700;
			font-size: 14px;
			color: #222;
		}
		.project-card-date {
			font-size: 11px;
			color: #888;
		}
		.project-card-code {
			font-size: 12px;
			color: #667eea;
			font-weight: 700;
		}
		.project-card-email {
			font-size: 12px;
			color: #555;
		}
		.project-card-actions {
			flex-shrink: 0;
		}

		/* Dark mode para users.html */
		body.dark-mode { background: #12121e; color: #e0e0e0; }
		body.dark-mode .users-container { background: #1e1e2e; box-shadow: 0 4px 18px rgba(0,0,0,0.4); }
		body.dark-mode .users-header h1 { color: #c4b8f5; }
		body.dark-mode table.users-table th { background: #252535; color: #bbb; }
		body.dark-mode table.users-table th,
		body.dark-mode table.users-table td { border-bottom-color: #333; color: #ddd; }
		body.dark-mode table.users-table tbody tr:hover { background: #252535; }
		body.dark-mode .message.info { background: #1a2a3a; color: #90caf9; border-color: #1e3a5f; }
		body.dark-mode .message.error { background: #2a1a1a; color: #ef9a9a; border-color: #4a1a1a; }
		body.dark-mode .message.success { background: #1a2a1a; color: #a5d6a7; border-color: #1b4a1b; }
		body.dark-mode .section-tabs { border-bottom-color: #333; }
		body.dark-mode .tab-btn { background: #252535; color: #aaa; }
		body.dark-mode .tab-btn.active { background: #667eea; color: #fff; }
		body.dark-mode .project-card { background: #252535; border-color: #333; }
		body.dark-mode .project-card:hover { background: #2d2d45; }
		body.dark-mode .project-card-name { color: #e0e0e0; }
		body.dark-mode .project-card-email { color: #aaa; }
	</style>
</head>
<body>
	<div class="users-container">
		<div class="users-header">
			<h1><span>⚙️</span> Painel Admin <span id="adminBadge" style="display:none;" class="badge badge-admin">Admin</span></h1>
			<div class="users-actions">
				<button class="btn-small" id="btnDark" onclick="toggleDarkMode()" style="background:#444;color:#fff;border-radius:20px;">🌙 Dark</button>
				<button class="btn-small btn-secondary" onclick="window.location.href='index.html'">⬅ Voltar</button>
				<button class="btn-small btn-primary" id="btnReload" onclick="reloadCurrent()">🔄 Recarregar</button>
			</div>
		</div>

		<div id="messageContainer"></div>

		<!-- Abas -->
		<div class="section-tabs">
			<button class="tab-btn active" id="tabUsersBtn" onclick="switchAdminTab('users')">👥 Usuários</button>
			<button class="tab-btn" id="tabProjectsBtn" onclick="switchAdminTab('projects')">📁 Projetos</button>
		</div>

		<!-- Seção Usuários -->
		<div class="tab-section active" id="tabUsers">
			<table class="users-table">
				<thead>
					<tr>
						<th>Email</th>
						<th>Criado em</th>
						<th class="text-center">Ações</th>
					</tr>
				</thead>
				<tbody id="usersTbody">
					<tr><td colspan="3" class="text-center">Carregando...</td></tr>
				</tbody>
			</table>
		</div>

		<!-- Seção Projetos -->
		<div class="tab-section" id="tabProjects">
			<div class="projects-grid" id="projectsGrid">
				<p style="text-align:center; color:#aaa; padding:20px">Carregando projetos...</p>
			</div>
		</div>
	</div>

	<script>
		const ADMIN_EMAIL = 'carloscaxito@yahoo.com.br';

		let currentAdminTab = 'users';

		function switchAdminTab(tab) {
			currentAdminTab = tab;
			document.getElementById('tabUsers').classList.toggle('active', tab === 'users');
			document.getElementById('tabProjects').classList.toggle('active', tab === 'projects');
			document.getElementById('tabUsersBtn').classList.toggle('active', tab === 'users');
			document.getElementById('tabProjectsBtn').classList.toggle('active', tab === 'projects');
			if (tab === 'projects') loadProjects();
		}

		function reloadCurrent() {
			if (currentAdminTab === 'users') loadUsers();
			else loadProjects();
		}

		function showUsersMessage(type, text) {
			const container = document.getElementById('messageContainer');
			container.innerHTML = '';
			if (!text) return;

			const div = document.createElement('div');
			div.className = 'message ' + type;
			div.textContent = text;
			container.appendChild(div);
		}

		function formatDateTime(value) {
			if (!value) return '-';
			try {
				const d = new Date(value);
				if (Number.isNaN(d.getTime())) return value;
				return d.toLocaleString('pt-BR');
			} catch (e) {
				return value;
			}
		}

		function renderUsers(users, currentUserId) {
			const tbody = document.getElementById('usersTbody');
			tbody.innerHTML = '';

			if (!users || users.length === 0) {
				const tr = document.createElement('tr');
				const td = document.createElement('td');
				td.colSpan = 3;
				td.className = 'text-center';
				td.textContent = 'Nenhum usuário encontrado.';
				tr.appendChild(td);
				tbody.appendChild(tr);
				return;
			}

			users.forEach(user => {
				const tr = document.createElement('tr');

				const tdEmail = document.createElement('td');
				tdEmail.textContent = user.email || '-';
				tr.appendChild(tdEmail);

				const tdCreated = document.createElement('td');
				tdCreated.textContent = formatDateTime(user.created_at);
				tr.appendChild(tdCreated);

				const tdActions = document.createElement('td');
				tdActions.className = 'text-center';

				const btnDelete = document.createElement('button');
				btnDelete.className = 'btn-small btn-danger';
				btnDelete.textContent = '🗑 Excluir';
				btnDelete.onclick = () => confirmDeleteUser(user.id, user.email);

				// Evitar que o usuário delete a si mesmo por engano
				if (currentUserId && user.id === currentUserId) {
					btnDelete.disabled = true;
					btnDelete.title = 'Não é possível excluir o usuário atualmente logado.';
				}

				tdActions.appendChild(btnDelete);
				tr.appendChild(tdActions);

				tbody.appendChild(tr);
			});
		}

		async function loadProjects() {
			const grid = document.getElementById('projectsGrid');
			grid.innerHTML = '<p style="text-align:center;color:#aaa;padding:20px">Carregando projetos...</p>';
			try {
				await window.initSupabase();
				const client = window.getClient();
				if (!client) { grid.innerHTML = '<p style="color:red">Erro ao inicializar.</p>'; return; }

				// Carregar projetos
				const { data: projects, error: pErr } = await client
					.from('projects')
					.select('id, name, project_code, created_at, user_id')
					.order('created_at', { ascending: false });

				if (pErr) { grid.innerHTML = '<p style="color:red">Erro: ' + pErr.message + '</p>'; return; }

				// Carregar usuários para cruzar email
				const { data: users } = await client
					.from('users')
					.select('id, email');

				const userMap = {};
				(users || []).forEach(u => userMap[u.id] = u.email);

				if (!projects || projects.length === 0) {
					grid.innerHTML = '<p style="text-align:center;color:#aaa;padding:30px">Nenhum projeto encontrado.</p>';
					return;
				}

				grid.innerHTML = '';
				projects.forEach(p => {
					const email = userMap[p.user_id] || '—';
					const date = p.created_at ? new Date(p.created_at).toLocaleString('pt-BR') : '—';
					const card = document.createElement('div');
					card.className = 'project-card';
					card.innerHTML = `
						<div class="project-card-info">
							<span class="project-card-name">${p.name || 'Sem nome'}</span>
							<span class="project-card-date">${date}</span>
							${p.project_code ? '<span class="project-card-code">🔑 ' + p.project_code + '</span>' : ''}
							<span class="project-card-email">✉️ ${email}</span>
						</div>
						<div class="project-card-actions">
							<button class="btn-small btn-danger" onclick="confirmDeleteProject('${p.id}', '${(p.name||'').replace(/'/g,'')}')">🗑 Excluir</button>
						</div>`;
					grid.appendChild(card);
				});
			} catch(e) {
				grid.innerHTML = '<p style="color:red">Erro: ' + e.message + '</p>';
			}
		}

		async function confirmDeleteProject(id, name) {
			if (!confirm('Excluir o projeto "' + name + '"? Esta ação não pode ser desfeita.')) return;
			try {
				await window.initSupabase();
				const client = window.getClient();
				const { error } = await client.from('projects').delete().eq('id', id);
				if (error) { alert('Erro ao excluir: ' + error.message); return; }
				loadProjects();
			} catch(e) {
				alert('Erro: ' + e.message);
			}
		}

		async function loadUsers() {
			const btnReload = document.getElementById('btnReload');
			if (btnReload) btnReload.disabled = true;

			try {
				showUsersMessage('info', 'Carregando usuários...');

				await window.initSupabase();
				const client = window.getClient();
				if (!client) {
					showUsersMessage('error', 'Erro ao inicializar Supabase. Recarregue a página.');
					return;
				}

				// Garante que existe sessão (usa lógica do auth.js)
				const currentSessionUser = await checkAuth();
				if (!currentSessionUser) {
					// checkAuth já redireciona para auth.html se necessário
					return;
				}

				// Lista usuários da tabela pública "users" (espelho de auth.users)
				const { data, error } = await client
					.from('users')
					.select('id, email, created_at')
					.order('created_at', { ascending: false });

				if (error) {
					console.error('Erro ao carregar usuários:', error);
					showUsersMessage('error', 'Erro ao carregar usuários: ' + error.message);
					renderUsers([], null);
					return;
				}

				// Se for o admin, exibe badge visual
				if (currentSessionUser.email === ADMIN_EMAIL) {
					const badge = document.getElementById('adminBadge');
					if (badge) badge.style.display = 'inline-block';
				}

				renderUsers(data || [], currentSessionUser.id || null);
				showUsersMessage('', '');
			} catch (e) {
				console.error('Erro geral ao carregar usuários:', e);
				showUsersMessage('error', 'Erro inesperado ao carregar usuários: ' + (e.message || e));
			} finally {
				if (btnReload) btnReload.disabled = false;
			}
		}

		async function confirmDeleteUser(userId, email) {
			if (!userId) return;

			const sure = confirm('Tem certeza que deseja excluir o usuário "' + (email || userId) + '"? Esta ação não pode ser desfeita.');
			if (!sure) return;

			await deleteUser(userId, email);
		}

		async function deleteUser(userId, email) {
			try {
				showUsersMessage('info', 'Excluindo usuário ' + (email || '') + '...');

				await window.initSupabase();
				const client = window.getClient();
				if (!client) {
					showUsersMessage('error', 'Erro ao inicializar Supabase.');
					return;
				}

				// Exclusão na tabela pública "users" (espelho)
				const { error } = await client
					.from('users')
					.delete()
					.eq('id', userId);

				if (error) {
					console.error('Erro ao excluir usuário:', error);
					showUsersMessage('error', 'Erro ao excluir usuário: ' + error.message);
					return;
				}

				showUsersMessage('success', 'Usuário ' + (email || '') + ' excluído com sucesso da tabela pública.');
				await loadUsers();
			} catch (e) {
				console.error('Erro geral ao excluir usuário:', e);
				showUsersMessage('error', 'Erro inesperado ao excluir usuário: ' + (e.message || e));
			}
		}

		document.addEventListener('DOMContentLoaded', async function () {
			// Garante que apenas o admin acesse a página
			const user = await checkAuth();
			if (!user) return;

			if (user.email !== ADMIN_EMAIL) {
				showUsersMessage('error', 'Acesso restrito: apenas o administrador pode visualizar esta página.');
				setTimeout(() => {
					window.location.href = 'index.html';
				}, 2000);
				return;
			}

			loadUsers();
		});

		function toggleDarkMode() {
			const isDark = document.body.classList.toggle('dark-mode');
			localStorage.setItem('darkMode', isDark ? '1' : '0');
			const btn = document.getElementById('btnDark');
			if (btn) { btn.textContent = isDark ? '☀️ Claro' : '🌙 Dark'; btn.style.background = isDark ? '#667eea' : '#444'; }
		}
		(function() {
			if (localStorage.getItem('darkMode') === '1') {
				document.body.classList.add('dark-mode');
				window.addEventListener('DOMContentLoaded', () => {
					const btn = document.getElementById('btnDark');
					if (btn) { btn.textContent = '☀️ Claro'; btn.style.background = '#667eea'; }
				});
			}
		})();
	</script>
</body>
</html>
